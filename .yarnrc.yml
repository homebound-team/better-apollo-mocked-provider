nodeLinker: node-modules

npmPublishAccess: public

npmPublishRegistry: "https://registry.npmjs.org"

# Required: some deps rely on install/postinstall scripts to build native binaries
# (i.e. unrs-resolver, husky). Yarn 4 defaults this to `false`.
enableScripts: true

yarnPath: .yarn/releases/yarn-4.18.1.cjs
